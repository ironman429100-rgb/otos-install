name: Windows bundled runtime candidate

on:
  push:
    branches: [candidate/windows-install-resume-20261019]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Parse buyer and builder scripts
        shell: pwsh
        run: |
          foreach ($path in @('install.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "PowerShell 구문 오류: $path : $($parseErrors -join '; ')" }
          }
      - name: Download buyer runtime release and extract it
        shell: pwsh
        run: |
          $url = 'https://github.com/ironman429100-rgb/otos-install/releases/download/windows-runtime-20261019-test/otos-windows-runtime-20261019.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'buyer-runtime.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '8e6dc5d58393328800b487cdd2cd809aeb4996013d8734e9603689d59b87e5a7') { throw 'Buyer runtime release SHA-256 mismatch.' }
          $product = Join-Path $env:RUNNER_TEMP 'buyer-product'
          New-Item -ItemType Directory -Path $product -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $product
          if (-not (Test-Path -LiteralPath (Join-Path $product 'windows-runtime\files.json'))) { throw 'Buyer runtime release layout is invalid.' }
      - name: Verify installer runtime stage in Windows PowerShell 5.1
        shell: powershell
        run: |
          $product = Join-Path $env:RUNNER_TEMP 'buyer-product'
          $plugin = Join-Path $product 'plugins\otos-studio'
          $scripts = Join-Path $plugin 'scripts'
          New-Item -ItemType Directory -Path $scripts -Force | Out-Null
          @'
          def prepare():
              import mediapipe
          '@ | Set-Content -LiteralPath (Join-Path $scripts 'windows_pose.py') -Encoding ASCII
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'install.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw "Windows PowerShell 5.1 parse failed: $($parseErrors -join '; ')" }
          $names = @('Stop-Install', 'Write-InstallEvent', 'Invoke-QuietExternal', 'Initialize-WindowsRuntime')
          foreach ($definition in $ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $false)) {
            if ($names -contains $definition.Name) { Invoke-Expression $definition.Extent.Text }
          }
          $installLog = Join-Path $env:RUNNER_TEMP 'installer-test.log'
          $modelSha256 = '5134a3aad27a58b93da0088d431f366da362b44e3ccfbe3462b3827a839011b1'
          $windowsRoot = Join-Path $env:RUNNER_TEMP 'ot-os-windows-test'
          $runtime = Initialize-WindowsRuntime $product $plugin $env:RUNNER_TEMP
          if ($runtime -ne (Join-Path $product 'windows-runtime\python\python.exe')) { throw 'Installer chose the wrong Python runtime.' }
          $pycache = Join-Path $product 'windows-runtime\python\Lib\site-packages\__pycache__'
          New-Item -ItemType Directory -Path $pycache -Force | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $pycache 'resume-test.pyc'), [byte[]]@(1, 2, 3))
          $runtimeManifest = Get-Content -LiteralPath (Join-Path $product 'windows-runtime\files.json') -Raw | ConvertFrom-Json
          $hashMismatches = @($runtimeManifest.files | Where-Object {
            $path = Join-Path (Join-Path $product 'windows-runtime') $_.path
            -not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $_.sha256
          })
          Write-Host "Changed runtime manifest files after first validation: $($hashMismatches.Count)"
          if ($hashMismatches.Count) { $hashMismatches | Select-Object -First 5 -ExpandProperty path | Write-Host }
          $runtimeAgain = Initialize-WindowsRuntime $product $plugin $env:RUNNER_TEMP
          if ($runtimeAgain -ne $runtime) { throw 'Runtime revalidation with generated Python cache failed.' }
          Write-Host 'Windows PowerShell 5.1 installer runtime validation and resume revalidation passed.'
      - name: Launch packaged Chromium after installer validation
        shell: pwsh
        run: |
          $product = Join-Path $env:RUNNER_TEMP 'buyer-product'
          $runtime = Join-Path $product 'windows-runtime\python\python.exe'
          & $runtime -c 'import PIL, mediapipe, playwright.async_api; print("runtime imports passed")'
          if ($LASTEXITCODE -ne 0) { throw 'Portable Python package imports failed.' }
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $product 'windows-runtime\browsers'
          & $runtime -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); print(b.version); b.close(); p.stop()'
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Chromium launch failed.' }
