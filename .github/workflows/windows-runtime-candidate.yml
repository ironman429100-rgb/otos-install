name: Windows bundled runtime candidate

on:
  push:
    branches: [candidate/bundled-windows-runtime-20261019]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Parse buyer and builder scripts
        shell: pwsh
        run: |
          foreach ($path in @('install.ps1', 'build-windows-runtime.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "PowerShell 구문 오류: $path : $($parseErrors -join '; ')" }
          }
      - name: Build portable runtime with Windows dependencies
        shell: pwsh
        run: |
          $product = Join-Path $env:RUNNER_TEMP 'candidate-product'
          $plugin = Join-Path $product 'plugins\otos-studio'
          New-Item -ItemType Directory -Path $plugin -Force | Out-Null
          @('playwright>=1.40,<2', 'Pillow>=10,<13') | Set-Content -LiteralPath (Join-Path $plugin 'requirements.txt') -Encoding ASCII
          @('mediapipe==0.10.32', 'playwright==1.55.0') | Set-Content -LiteralPath (Join-Path $plugin 'requirements-windows.txt') -Encoding ASCII
          $zip = Join-Path $env:RUNNER_TEMP 'python-embed.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          ./build-windows-runtime.ps1 -ProductRoot $product -BuilderPython (Get-Command python).Source -EmbeddedPythonZip $zip -EmbeddedPythonZipSha256 $hash
          $runtime = Join-Path $product 'windows-runtime\python\python.exe'
          & $runtime -c 'import PIL, mediapipe, playwright.async_api; print("runtime imports passed")'
          if ($LASTEXITCODE -ne 0) { throw 'Portable Python package imports failed.' }
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $product 'windows-runtime\browsers'
          & $runtime -c 'import asyncio; from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); print(b.version); b.close(); p.stop()'
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Chromium launch failed.' }
          Write-Host "Windows runtime build and Chromium launch passed; files: $((Get-Content (Join-Path $product 'windows-runtime\files.json') -Raw | ConvertFrom-Json).files.Count)"
